server {
    listen 8081;
    location / {
        if ($server_protocol != "HTTP/1.1") { return 426; }
        default_type application/json;
        return 200 '{"authorization":"$http_authorization","demo":"$http_x_demo_user","principal":"$http_x_ms_client_principal_name","rawToken":"$http_x_ms_token_aad_id_token","uri":"$uri"}';
    }
}
