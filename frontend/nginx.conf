map $http_x_ms_token_aad_id_token $api_authorization {
    "" $http_authorization;
    default "Bearer $http_x_ms_token_aad_id_token";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        if ($api_authorization = "") { return 401; }
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_set_header Authorization $api_authorization;
        proxy_set_header X-MS-TOKEN-AAD-ID-TOKEN "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL "";
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME "";
        proxy_set_header X-Demo-User "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-Forwarded-Email "";
        add_header Cache-Control "no-store" always;
    }

    # React Router uses client-side routing; any path that isn't a real static
    # file must fall back to index.html so deep links (e.g. /catalog) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not cached
    # (implicit, since it's excluded by the immutable assets path below) so new
    # deployments are always picked up.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
