http_port 0.0.0.0:3128
visible_hostname llmserving-private-connect
acl tunnel method CONNECT
acl tls_port port 443
acl approved dstdomain -n "/etc/llmserving/hosts.txt"
http_access deny !tunnel
http_access deny !tls_port
http_access allow approved
http_access deny all

dns_nameservers 10.20.31.4
cache deny all
access_log none
cache_log /tmp/squid-cache.log
cache_store_log none
pid_filename none
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 1 seconds
