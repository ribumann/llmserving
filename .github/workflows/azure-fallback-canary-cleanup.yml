name: Azure fallback canary cleanup

on:
  workflow_run:
    workflows: [Azure fallback OIDC canary]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: azure-fallback-oidc-canary-resource
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == vars.AZURE_OPERATOR_REPOSITORY && vars.ENABLE_AZURE_OPERATOR_WORKFLOWS == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-e2e-fallback
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LLM_SERVING_OPERATOR_CONFIG: ${{ secrets.LLM_SERVING_OPERATOR_CONFIG }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CANARY_RESOURCE_GROUP: ${{ secrets.AZURE_CANARY_RESOURCE_GROUP }}
      AZURE_CANARY_REGION: ${{ secrets.AZURE_CANARY_REGION }}
      AZURE_CORE_OUTPUT: none
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate and mask protected configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          keys = ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                  "AZURE_CANARY_RESOURCE_GROUP", "AZURE_CANARY_REGION")
          missing = [key for key in keys if not os.environ.get(key)]
          for key in keys:
              value = os.environ.get(key, "")
              if value:
                  value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{value}")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          owner_id = os.environ.get("GITHUB_REPOSITORY_OWNER_ID", "")
          repo_id = os.environ.get("GITHUB_REPOSITORY_ID", "")
          if "/" in repo and owner_id and repo_id:
              owner, name = repo.split("/", 1)
              print(f"::add-mask::repo:{owner}@{owner_id}/{name}@{repo_id}:environment:azure-e2e-fallback")
          if missing:
              raise SystemExit(f"Missing protected canary configuration: {', '.join(missing)}")
          PY
      # Only protected main code; never triggering SHA, artifacts or resource lists.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate fixed fallback target before login
        run: python scripts/azure_canary.py validate-config --target fallback
      - name: Azure OIDC login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Delete only completed-run owned canary and verify absence
        run: python scripts/azure_canary.py cleanup --target fallback
