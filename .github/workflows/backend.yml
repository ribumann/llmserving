name: Backend

# Pushes and PRs run read-only CI. Deployment requires an explicit main-branch
# dispatch, repository opt-in, and the separately configured azure-deployment environment.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/demo/**" # baked into the backend image; see backend/Dockerfile
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/demo/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the backend to the configured Azure environment
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test
          POSTGRES_DB: llmserving_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d llmserving_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-test@127.0.0.1:5432/llmserving_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-test@127.0.0.1:5432/llmserving_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (with dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check src tests

      - name: Black format check
        working-directory: backend
        run: black --check src tests

      - name: Migrate disposable PostgreSQL and seed reference data
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m src.persistence.seed_catalog
          python -m src.evaluation.seed_benchmarks
          python -m src.evaluation.seed_golden_datasets
          python -m src.performance.seed_workloads

      - name: Full backend suite including integration and real PostgreSQL
        working-directory: backend
        run: python -m pytest -q -o addopts=""

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && vars.ENABLE_AZURE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    environment: azure-deployment
    permissions:
      id-token: write # required for OIDC
      contents: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
      IMAGE_NAME: llmserving-backend
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${RESOURCE_GROUP:?Configure AZURE_RESOURCE_GROUP}"
          : "${ACR_NAME:?Configure AZURE_ACR_NAME}"
          : "${CONTAINER_APP_NAME:?Configure AZURE_BACKEND_APP_NAME}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Tasks)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            -f backend/Dockerfile \
            .

      - name: Point Container App at new image
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"

      - name: Wait for database-backed readiness
        run: |
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
          url="https://${fqdn}/readyz"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "Backend database-ready."
              exit 0
            fi
            sleep 10
          done
          echo "Backend database did not become ready in time." >&2
          exit 1
