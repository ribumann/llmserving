name: Azure fallback billable disk cleanup

on:
  workflow_run:
    workflows: [Azure fallback billable disk probe]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: azure-fallback-billable-disk-probe
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == vars.AZURE_OPERATOR_REPOSITORY && vars.ENABLE_AZURE_OPERATOR_WORKFLOWS == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-e2e-fallback
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LLM_SERVING_OPERATOR_CONFIG: ${{ secrets.LLM_SERVING_OPERATOR_CONFIG }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_OUTPUT: none
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate fixed cleanup configuration and mask OIDC subject before login
        run: python scripts/azure_disk_probe.py validate-cleanup
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Delete only completed-run owned disk and verify absence and group preservation
        run: python scripts/azure_disk_probe.py cleanup
