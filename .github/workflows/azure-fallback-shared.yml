name: Azure fallback bounded shared provision

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: azure-fallback-shared-lifecycle
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.repository == vars.AZURE_OPERATOR_REPOSITORY && vars.ENABLE_AZURE_OPERATOR_WORKFLOWS == 'true' &&
      github.ref == 'refs/heads/main' &&
      vars.FALLBACK_STATE_DATA_ACCESS_APPROVED == 'true' &&
      vars.FALLBACK_SHARED_CLEANUP_ARMED == 'true' &&
      vars.FALLBACK_SHARED_CREATION_ENABLED == 'true' &&
      vars.FALLBACK_PRIVATE_STATE_EXECUTOR_READY == 'true' &&
      vars.AZURE_OPERATOR_RUNNER_LABEL != ''
    runs-on: [self-hosted, linux, x64, "${{ vars.AZURE_OPERATOR_RUNNER_LABEL }}"]
    environment: azure-e2e-fallback
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LLM_SERVING_OPERATOR_CONFIG: ${{ secrets.LLM_SERVING_OPERATOR_CONFIG }}
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      STATE_DATA_ACCESS_APPROVED: ${{ vars.FALLBACK_STATE_DATA_ACCESS_APPROVED }}
      SHARED_CLEANUP_ARMED: ${{ vars.FALLBACK_SHARED_CLEANUP_ARMED }}
      SHARED_CREATION_ENABLED: ${{ vars.FALLBACK_SHARED_CREATION_ENABLED }}
      PRIVATE_STATE_EXECUTOR_READY: ${{ vars.FALLBACK_PRIVATE_STATE_EXECUTOR_READY }}
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject unapproved target, storage credentials or unarmed cleanup before login
        run: python scripts/azure_shared_lifecycle.py validate-create
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Claim one-shot owner and apply only the exact private guarded shared plan
        run: python scripts/azure_shared_lifecycle.py create
