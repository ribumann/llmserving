name: Azure canary cleanup

on:
  workflow_run:
    workflows: [Azure OIDC canary]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: azure-oidc-canary-resource
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == vars.AZURE_OPERATOR_REPOSITORY && vars.ENABLE_AZURE_OPERATOR_WORKFLOWS == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-e2e
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LLM_SERVING_OPERATOR_CONFIG: ${{ secrets.LLM_SERVING_OPERATOR_CONFIG }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CANARY_RESOURCE_GROUP: ${{ secrets.AZURE_CANARY_RESOURCE_GROUP }}
      AZURE_CANARY_REGION: ${{ secrets.AZURE_CANARY_REGION }}
      AZURE_CORE_OUTPUT: none
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate and mask protected configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          for key in ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                      "AZURE_CANARY_RESOURCE_GROUP", "AZURE_CANARY_REGION"):
              value = os.environ.get(key)
              if not value:
                  raise SystemExit(f"Missing protected configuration: {key}")
              print(f"::add-mask::{value}")
          PY
      # Never checkout the triggering SHA or download artifacts from the canary/PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate explicit operator target before login
        run: python scripts/azure_canary.py validate-config
      - name: Azure OIDC login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Delete only completed-run owned canary and verify absence
        run: python scripts/azure_canary.py cleanup
