name: Frontend

# Pushes and PRs run read-only CI. Deployment requires an explicit main-branch
# dispatch, repository opt-in, and the separately configured azure-deployment environment.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the frontend to the configured Azure environment
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000 --loglevel=http
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/vite

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && vars.ENABLE_AZURE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    environment: azure-deployment
    permissions:
      id-token: write # required for OIDC
      contents: read
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      CONTAINER_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
      BACKEND_CONTAINER_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME }}
      IMAGE_NAME: llmserving-frontend
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mask and validate protected deployment configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          keys = ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                  "RESOURCE_GROUP", "ACR_NAME", "CONTAINER_APP_NAME",
                  "BACKEND_CONTAINER_APP_NAME")
          for key in keys:
              value = os.environ.get(key)
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}")
          for key in keys:
              if not os.environ.get(key):
                  raise SystemExit(f"Missing protected deployment configuration: {key}")
          PY

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend FQDN
        id: backend
        run: |
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$BACKEND_CONTAINER_APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "::add-mask::$fqdn"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Build and push image (ACR Tasks)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            -f frontend/Dockerfile \
            .

      - name: Point Container App at new image
        env:
          BACKEND_URL: https://${{ steps.backend.outputs.fqdn }}
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            --set-env-vars "BACKEND_URL=$BACKEND_URL"

      - name: Wait for frontend to come up
        run: |
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
          url="https://${fqdn}/"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "Frontend healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Frontend did not become healthy in time." >&2
          exit 1
