name: Runtime CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_release:
        description: Export checked candidate archives and manifest (main only; no deploy)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  LLM_SERVING_OPERATOR_CONFIG: '{"repository":${{ toJSON(github.repository) }}}'

jobs:
  real-local-api:
    uses: ./.github/workflows/local-fullstack.yml

  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline main-cloud acceptance harness contracts (not live acceptance)
        run: python -m unittest discover -s e2e/live/cloud -p 'test_*.py' -v
      - name: Install every job's real dependencies (separate from backend SDK versions)
        run: |
          python -m pip install pytest pytest-asyncio \
            -r jobs/common/requirements.txt \
            -r jobs/terraform_runner/requirements.txt \
            -r jobs/model_deployment/requirements.txt \
            -r jobs/evaluation_worker/requirements.txt \
            -r jobs/performance_worker/requirements.txt \
            -r jobs/export_worker/requirements.txt
      - name: All worker and shared job tests
        working-directory: jobs
        run: python -m pytest -q tests

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Functions runtime and test dependencies
        run: python -m pip install pytest pytest-asyncio -r functions/requirements.txt
      - name: All Functions tests
        working-directory: functions
        run: python -m pytest -q tests
      - name: Build deployment package including runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/functions-package"
          mkdir -p "$package"
          cp -R functions/function_app.py functions/host.json functions/requirements.txt \
            functions/activities functions/orchestrators functions/orchestration_lib "$package/"
          python -m pip install --target "$package/.python_packages/lib/site-packages" \
            -r functions/requirements.txt
          cd "$package"
          python -m zipfile -c "$RUNNER_TEMP/functions.zip" .
      - name: Import and enumerate functions from extracted deployment package
        shell: bash
        run: |
          set -euo pipefail
          python -m zipfile -e "$RUNNER_TEMP/functions.zip" "$RUNNER_TEMP/functions-smoke"
          cd "$RUNNER_TEMP/functions-smoke"
          PYTHONPATH="$PWD/.python_packages/lib/site-packages" python - <<'PY'
          import function_app
          registered = function_app.app.get_functions()
          assert len(registered) >= 8, f"Missing function registrations: {len(registered)}"
          print(f"Packaged Functions import/registration smoke passed ({len(registered)} functions).")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functions-${{ github.sha }}
          path: ${{ runner.temp }}/functions.zip
          retention-days: 7
      - name: Record checked Functions candidate checksum
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
        run: |
          mkdir -p "$RUNNER_TEMP/release-records"
          python scripts/release_bundle.py record --component functions \
            --archive "$RUNNER_TEMP/functions.zip" > "$RUNNER_TEMP/release-records/functions.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
        with:
          name: release-record-functions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-records/functions.json
          if-no-files-found: error
          retention-days: 7

  mocked-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Existing API-mocked browser suite (not full-stack)
        run: npm test
        working-directory: e2e

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, terraform_runner, model_deployment, evaluation_worker, performance_worker, export_worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build real image without registry credentials or push
        timeout-minutes: ${{ matrix.image == 'frontend' && 10 || 45 }}
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE" in
            backend|frontend) dockerfile="$IMAGE/Dockerfile" ;;
            *) dockerfile="jobs/$IMAGE/Dockerfile" ;;
          esac
          docker build --file "$dockerfile" --tag "llmserving-ci:$IMAGE" .
      - name: Actual packaged toolkits on bounded CPU Ollama
        if: matrix.image == 'backend' || matrix.image == 'performance_worker'
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker network create llmserving-ci-toolkits
          docker run --detach --name llmserving-ci-toolkit-ollama \
            --network llmserving-ci-toolkits --cpus=2 --memory=2g --pids-limit=256 \
            -e OLLAMA_MAX_LOADED_MODELS=1 -e OLLAMA_NUM_PARALLEL=1 \
            -p 127.0.0.1:11434:11434 \
            ollama/ollama@sha256:2c9595c555fd70a28363489ac03bd5bf9e7c5bdf2890373c3a830ffd7252ce6d
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --max-time 3 http://127.0.0.1:11434/api/version
          curl --fail --silent --show-error --max-time 300 \
            -H 'Content-Type: application/json' \
            --data '{"model":"qwen2.5:0.5b-instruct","stream":false}' \
            http://127.0.0.1:11434/api/pull
          mkdir -p "$RUNNER_TEMP/toolkit-evidence"
          tools=(benchmark llmperf)
          runtime_env=()
          if [ "$IMAGE" = performance_worker ]; then
            tools=(llmperf)
            runtime_env=(-e PYTHONPATH=/app)
          fi
          for tool in "${tools[@]}"; do
            timeout --signal=TERM --kill-after=10s 240s docker run --rm \
              --name "llmserving-ci-toolkit-$tool" --network llmserving-ci-toolkits \
              --cpus=2 --memory=4g --shm-size=256m --pids-limit=512 \
              -e APP_ENV=test -e AUTH_MODE=local-demo \
              -e LIVE_MODEL_URL=http://llmserving-ci-toolkit-ollama:11434 \
              -e GITHUB_SHA -e OPENAI_API_KEY=ci-local-unused \
              -e RAY_USAGE_STATS_ENABLED=0 -e HF_HUB_DISABLE_TELEMETRY=1 \
              -e DO_NOT_TRACK=1 -e TOKENIZERS_PARALLELISM=false -e OMP_NUM_THREADS=1 \
              "${runtime_env[@]}" \
              --mount "type=bind,src=$PWD/scripts/validate_local_toolkits.py,dst=/validation.py,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/toolkit-evidence,dst=/evidence" \
              --entrypoint python "llmserving-ci:$IMAGE" /validation.py \
              --tool "$tool" --output "/evidence/$tool.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (matrix.image == 'backend' || matrix.image == 'performance_worker')
        with:
          name: ${{ matrix.image == 'backend' && 'genuine-local-toolkit-evidence' || 'genuine-performance-worker-toolkit-evidence' }}
          path: ${{ runner.temp }}/toolkit-evidence/
          retention-days: 7
      - name: Remove only this job's toolkit containers and private network
        if: always() && (matrix.image == 'backend' || matrix.image == 'performance_worker')
        run: |
          set -euo pipefail
          containers=$(docker ps -a --format '{{.Names}}')
          for container in llmserving-ci-toolkit-benchmark llmserving-ci-toolkit-llmperf llmserving-ci-toolkit-ollama; do
            if printf '%s\n' "$containers" | grep -Fqx "$container"; then
              docker rm --force "$container"
            fi
          done
          networks=$(docker network ls --format '{{.Name}}')
          if printf '%s\n' "$networks" | grep -Fqx llmserving-ci-toolkits; then
            docker network rm llmserving-ci-toolkits
          fi
      - name: Smoke real image runtime imports or HTTP
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE" in
            backend)
              docker run --rm --network none --entrypoint python "llmserving-ci:$IMAGE" -c \
                'import json, pathlib; from importlib.metadata import distribution; from src.api.app import app; import llmperf; d=json.loads(distribution("llmperf").read_text("direct_url.json")); assert d["vcs_info"]["commit_id"]=="f1d6bed47e4501b0e371082b41601b59ab55269f"; assert pathlib.Path(llmperf.__file__).with_name("token_benchmark_ray.py").is_file(); print("API and pinned genuine LLMPerf import smoke passed")'
              ;;
            frontend)
              trap 'docker rm --force llmserving-ci-frontend >/dev/null' EXIT
              docker run --detach --name llmserving-ci-frontend --network none \
                -e BACKEND_URL=http://127.0.0.1:8081 \
                --mount "type=bind,src=$PWD/frontend/tests/proxy-upstream.conf,dst=/etc/nginx/conf.d/test-upstream.conf,readonly" \
                "llmserving-ci:$IMAGE"
              ready=false
              for attempt in $(seq 1 30); do
                if docker exec llmserving-ci-frontend wget -qO- http://127.0.0.1/ >/dev/null; then
                  ready=true
                  break
                fi
                echo "Waiting for frontend HTTP (attempt $attempt/30)"
                sleep 1
              done
              if [ "$ready" != true ]; then
                echo "::error::Frontend image did not serve HTTP."
                exit 1
              fi
              docker exec llmserving-ci-frontend wget -qO- \
                --header="X-MS-TOKEN-AAD-ID-TOKEN: signed-fixture" \
                --header="X-Demo-User: forged" \
                --header="X-MS-CLIENT-PRINCIPAL-NAME: forged" \
                http://127.0.0.1/api/identity | \
                python -c 'import json,sys; p=json.load(sys.stdin); assert p=={"authorization":"Bearer signed-fixture","demo":"","principal":"","rawToken":"","uri":"/identity"}'
              docker exec llmserving-ci-frontend wget -qO- \
                --header="Authorization: Bearer bearer-fixture" \
                http://127.0.0.1/api/identity | \
                python -c 'import json,sys; assert json.load(sys.stdin)["authorization"]=="Bearer bearer-fixture"'
              if response=$(docker exec llmserving-ci-frontend wget -SO- http://127.0.0.1/api/identity 2>&1); then
                echo "::error::Proxy accepted a request without a token."
                exit 1
              fi
              printf '%s\n' "$response" | grep -q '401 Unauthorized'
              echo "Frontend HTTP and signed-token transport smoke passed (not Entra acceptance)"
              ;;
            *)
              docker run --rm --network none --entrypoint python "llmserving-ci:$IMAGE" -c \
                'import entrypoint; assert callable(entrypoint.run); print("Worker runtime import smoke passed")'
              if [ "$IMAGE" = terraform_runner ]; then
                docker run --rm --network none --entrypoint terraform "llmserving-ci:$IMAGE" version
                docker run --rm --network none --entrypoint az "llmserving-ci:$IMAGE" version
              elif [ "$IMAGE" = performance_worker ]; then
                docker run --rm --network none --entrypoint python "llmserving-ci:$IMAGE" -c \
                  'import json, pathlib; from importlib.metadata import distribution; from src.performance.llmperf_runner import LlmPerfRunner; import llmperf; d=json.loads(distribution("llmperf").read_text("direct_url.json")); assert d["vcs_info"]["commit_id"]=="f1d6bed47e4501b0e371082b41601b59ab55269f"; assert pathlib.Path(llmperf.__file__).with_name("token_benchmark_ray.py").is_file(); assert pathlib.Path(llmperf.__file__).with_name("sonnet.txt").is_file(); print("Canonical worker runner and genuine pinned LLMPerf import smoke passed")'
              fi
              ;;
          esac
      - name: Export the exact checked image and checksum record
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-images" "$RUNNER_TEMP/release-records"
          docker save "llmserving-ci:$IMAGE" | gzip -1 > "$RUNNER_TEMP/release-images/$IMAGE.tar.gz"
          image_id=$(docker image inspect "llmserving-ci:$IMAGE" --format '{{.Id}}')
          python scripts/release_bundle.py record --component "$IMAGE" \
            --archive "$RUNNER_TEMP/release-images/$IMAGE.tar.gz" \
            --image-id "$image_id" > "$RUNNER_TEMP/release-records/$IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
        with:
          name: release-image-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images/${{ matrix.image }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
        with:
          name: release-record-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-records/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 7

  release-manifest:
    needs: [real-local-api, jobs, functions, mocked-browser, images]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-record-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-records
          merge-multiple: true
      - name: Require every checked component at this exact source and run
        run: |
          python scripts/release_bundle.py assemble \
            --records "$RUNNER_TEMP/release-records" > "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 7
