name: Azure main local shared bridge ARM cleanup

on:
  workflow_dispatch:
    inputs:
      cleanup_now:
        description: Delete only verified shared29 campaign resources now (false checks arming before expiry)
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read

concurrency:
  group: azure-fallback-shared-lifecycle
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'ribumann/llmserving' &&
      github.ref == 'refs/heads/main' &&
      vars.FALLBACK_SHARED_BRIDGE_CLEANUP_ARMED == 'true'
    runs-on: ubuntu-latest
    environment: azure-e2e-fallback
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CORE_OUTPUT: none
      FALLBACK_SHARED_BRIDGE_CLEANUP_ARMED: ${{ vars.FALLBACK_SHARED_BRIDGE_CLEANUP_ARMED }}
      FALLBACK_SHARED_BRIDGE_EXPIRES_AT: ${{ vars.FALLBACK_SHARED_BRIDGE_EXPIRES_AT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mask fixed protected subject before login
        run: PYTHONPATH=scripts python -c 'from azure_disk_probe import mask_subject; mask_subject()'
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Verify fixed ARM cleanup ownership without any blob/network dependency
        env:
          CLEANUP_NOW: ${{ inputs.cleanup_now }}
        run: |
          if [ "$CLEANUP_NOW" = "true" ]; then
            python scripts/azure_shared_bridge.py arm-cleanup --now
          else
            python scripts/azure_shared_bridge.py arm-cleanup
          fi
